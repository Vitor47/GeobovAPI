[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests — isolated logic with mocks",
    "integration: Integration tests — repository and database layer",
    "component: Component tests — HTTP endpoints via TestClient",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.12"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false