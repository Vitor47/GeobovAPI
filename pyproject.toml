[project]
name = "geobov"
version = "0.1.0"
description = "GeoBov cattle tracking API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.18.4",
    "bcrypt>=4.2",
    "click>=8.3.1",
    "dependency-injector==4.48.3",
    "email-validator==2.2.0",
    "fastapi==0.132.0",
    "fastapi-utils==0.8.0",
    "pydantic==2.12.5",
    "pydantic-settings==2.13.1",
    "pyjwt==2.13.0",
    "pymongo==4.13.2",
    "psycopg2-binary==2.9.11",
    "python-dotenv==1.2.1",
    "redis==7.3.0",
    "scalar-fastapi==1.8.2",
    "sqladmin==0.29.0",
    "sqlalchemy==2.0.46",
    "structlog==25.5.0",
    "uvicorn==0.41.0",
    "typing-inspect>=0.9.0",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "autoflake==2.3.3",
    "black==26.5.1",
    "flake8==7.3.0",
    "httpx==0.28.1",
    "isort==8.0.1",
    "mongomock==4.3.0",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "pylint==4.0.5",
    "pytest==8.3.4",
    "pytest-mock==3.14.0",
    "watchfiles>=1.0.0",
]

[tool.uv]
package = false

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"
line_length = 88

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests — isolated logic with mocks",
    "integration: Integration tests — repository and database layer",
    "component: Component tests — HTTP endpoints via TestClient",
]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.14"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
packages = ["app", "tests"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["wtforms", "wtforms.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.bootstrap.admin.views"]
# sqladmin ModelView attrs expect InstrumentedAttribute; SQLAlchemy Column
# annotations on declarative models do not match those stubs.
disable_error_code = ["list-item", "arg-type"]
