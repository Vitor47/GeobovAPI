repos:
  - repo: local
    hooks:
      - id: black
        name: Run Black Formatter
        entry: uv run --frozen black
        language: system
        args:
          - --line-length=88
          - --check
          - --preview
        types:
          - python

      - id: flake8
        name: Run Flake8 Linter
        entry: uv run --frozen flake8
        language: system
        types:
          - python

      - id: isort
        name: Run Isort
        entry: uv run --frozen isort
        language: system
        args:
          - --profile=black
          - --line-length=88
          - --check-only
          - --diff
        types:
          - python

      - id: mypy
        name: Run Mypy Type Checker
        entry: uv run --frozen mypy
        language: system
        pass_filenames: false
        always_run: true
        args:
          - app
          - tests

      - id: pylint
        name: Run Pylint Linter
        entry: uv run --frozen pylint
        language: system
        pass_filenames: false
        always_run: true
        args:
          - --rcfile=.pylintrc
          - app
          - tests

      - id: pytest
        name: Run Tests
        entry: uv run --frozen python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        args:
          - tests/
          - -v
          - --tb=short
          - --strict-markers
