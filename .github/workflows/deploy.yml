# GeoBov deploy.
# A tag v* or Actions → Run workflow asks the server to update itself.
# GitHub never opens SSH. The server downloads one private artifact and runs
# the deploy command stored in AWS.

name: GeoBov deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      update_api:
        description: Rebuild and restart the API
        type: boolean
        default: true
      update_postgres:
        description: Update Postgres (data volume is kept)
        type: boolean
        default: false
      update_redis:
        description: Update Redis (data volume is kept)
        type: boolean
        default: false
      update_mongo:
        description: Update MongoDB (data volume is kept)
        type: boolean
        default: false
      run_migrations:
        description: Run database migrations (alembic upgrade head)
        type: boolean
        default: false

concurrency:
  group: geobov-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy GeoBov
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve what to run
        id: options
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "update_api=true" >> "$GITHUB_OUTPUT"
            echo "update_postgres=false" >> "$GITHUB_OUTPUT"
            echo "update_redis=false" >> "$GITHUB_OUTPUT"
            echo "update_mongo=false" >> "$GITHUB_OUTPUT"
            echo "run_migrations=true" >> "$GITHUB_OUTPUT"
            echo "A tag release updates the API and runs migrations."
          else
            echo "update_api=${{ inputs.update_api }}" >> "$GITHUB_OUTPUT"
            echo "update_postgres=${{ inputs.update_postgres }}" >> "$GITHUB_OUTPUT"
            echo "update_redis=${{ inputs.update_redis }}" >> "$GITHUB_OUTPUT"
            echo "update_mongo=${{ inputs.update_mongo }}" >> "$GITHUB_OUTPUT"
            echo "run_migrations=${{ inputs.run_migrations }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Require at least one action
        run: |
          set -euo pipefail
          for flag in \
            "${{ steps.options.outputs.update_api }}" \
            "${{ steps.options.outputs.update_postgres }}" \
            "${{ steps.options.outputs.update_redis }}" \
            "${{ steps.options.outputs.update_mongo }}" \
            "${{ steps.options.outputs.run_migrations }}"
          do
            case "$flag" in
              true|false) ;;
              *)
                echo "Unexpected flag value."
                exit 1
                ;;
            esac
          done
          if [[ \
            "${{ steps.options.outputs.update_api }}" != "true" && \
            "${{ steps.options.outputs.update_postgres }}" != "true" && \
            "${{ steps.options.outputs.update_redis }}" != "true" && \
            "${{ steps.options.outputs.update_mongo }}" != "true" && \
            "${{ steps.options.outputs.run_migrations }}" != "true" \
          ]]; then
            echo "Choose at least one option: a service to update, or migrations."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::473841056634:role/geobov-github-deploy
          aws-region: sa-east-1

      - name: Upload the release artifact
        run: |
          set -euo pipefail
          tar -czf "${RUNNER_TEMP}/release.tar.gz" \
            --exclude '.git' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '.mypy_cache' \
            --exclude '.pytest_cache' \
            --exclude '.env' \
            --exclude '*/.env' \
            --exclude 'deploy/aws/*.pem' \
            --exclude 'deploy/aws/.provision-state.env' \
            -C "${GITHUB_WORKSPACE}" .
          if tar -tzf "${RUNNER_TEMP}/release.tar.gz" | grep -E '(^|/)(\.env|[^/]+\.pem)$'; then
            echo "Refusing to upload a secret file."
            exit 1
          fi
          aws s3 cp "${RUNNER_TEMP}/release.tar.gz" \
            "s3://geobov-deploy-473841056634/release.tar.gz" \
            --sse AES256 \
            --only-show-errors

      - name: Ask the server to update
        env:
          UPDATE_API: ${{ steps.options.outputs.update_api }}
          UPDATE_POSTGRES: ${{ steps.options.outputs.update_postgres }}
          UPDATE_REDIS: ${{ steps.options.outputs.update_redis }}
          UPDATE_MONGO: ${{ steps.options.outputs.update_mongo }}
          RUN_MIGRATIONS: ${{ steps.options.outputs.run_migrations }}
        run: |
          set -euo pipefail
          PARAMS="$(mktemp)"
          export PARAMS
          python3 -c 'import json,os,pathlib; pathlib.Path(os.environ["PARAMS"]).write_text(json.dumps({key:[os.environ[name]] for key,name in {"updateApi":"UPDATE_API","updatePostgres":"UPDATE_POSTGRES","updateRedis":"UPDATE_REDIS","updateMongo":"UPDATE_MONGO","runMigrations":"RUN_MIGRATIONS"}.items()}))'
          CMD="$(aws ssm send-command \
            --document-name GeoBovDeploy \
            --targets Key=tag:Project,Values=GeoBov \
            --parameters "file://${PARAMS}" \
            --comment "geobov ${GITHUB_SHA}" \
            --timeout-seconds 1500 \
            --query Command.CommandId \
            --output text)"
          echo "Command ${CMD}"
          IID=""
          STATUS="Pending"
          for _ in $(seq 1 150); do
            IID="$(aws ssm list-command-invocations \
              --command-id "${CMD}" \
              --query 'CommandInvocations[0].InstanceId' \
              --output text 2>/dev/null || true)"
            if [[ -n "${IID}" && "${IID}" != "None" ]]; then
              STATUS="$(aws ssm get-command-invocation \
                --command-id "${CMD}" \
                --instance-id "${IID}" \
                --query Status \
                --output text)"
            fi
            case "${STATUS}" in
              Success|Failed|Cancelled|TimedOut|Cancelling) break ;;
            esac
            sleep 10
          done
          if [[ -z "${IID}" || "${IID}" == "None" ]]; then
            echo "The server did not pick up the command."
            exit 1
          fi
          aws ssm get-command-invocation \
            --command-id "${CMD}" \
            --instance-id "${IID}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
          [[ "${STATUS}" == "Success" ]]
